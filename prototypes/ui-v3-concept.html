<!DOCTYPE html>
<html lang='zh-CN'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>AI 视觉实验台 · 概念原型</title>
<style>
:root{
  --bg:#f6f5f1; --panel:#ffffff; --line:#e7e3da; --text:#2c2a26; --muted:#8a857b;
  --accent:#7c9a72; --accent-strong:#5f7f56; --accent-soft:#eef3ec;
  --orange:#d99748; --red:#c86b5e; --green:#5f8b5c;
  --radius:14px; --shadow:0 10px 30px rgba(60,50,30,.10);
}
html,body{margin:0;height:100%;font-family:'Segoe UI','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);overflow:hidden;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,textarea{font-family:inherit;color:inherit;}

.topbar{height:52px;display:flex;align-items:center;gap:14px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--line);position:relative;z-index:20;}
.logo{font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;}
.logo svg{color:var(--accent-strong);}
.project-wrap{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13px;}
.project-name{background:none;border:none;outline:none;font-size:13px;width:160px;color:var(--text);}
.save-dot{width:7px;height:7px;border-radius:50%;background:var(--orange);display:inline-block;}
.topbar-right{margin-left:auto;display:flex;gap:6px;}

.layout{display:flex;height:calc(100% - 52px);}
.sidebar{width:250px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;position:relative;z-index:10;}
.side-tabs{display:flex;border-bottom:1px solid var(--line);}
.side-tab{flex:1;padding:12px 0;font-size:13px;color:var(--muted);border-bottom:2px solid transparent;}
.side-tab.active{color:var(--accent-strong);border-color:var(--accent);font-weight:600;}
.side-body{flex:1;overflow:auto;padding:12px;}
.asset-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.asset-item{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;cursor:grab;user-select:none;}
.asset-item:hover{border-color:var(--accent);}
.asset-thumb{height:64px;border-radius:8px;background:linear-gradient(135deg,#dce8d5,#b9cfa9);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--accent-strong);margin-bottom:6px;overflow:hidden;}
.asset-thumb.scene{background:linear-gradient(135deg,#e4e0d6,#cfc7b4);color:#6b6353;}
.asset-thumb.plant{background:linear-gradient(135deg,#dce8d5,#a9c49a);color:#4d6b46;}
.asset-thumb.render{background:linear-gradient(135deg,#dfe6f0,#b9c6dd);color:#4b5c78;}
.asset-name{font-size:12px;font-weight:600;}
.asset-tags{font-size:10px;color:var(--muted);margin-top:3px;}
.tpl-item{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:12px;margin-bottom:8px;cursor:pointer;}
.tpl-item:hover{border-color:var(--accent);}
.tpl-title{font-weight:600;margin-bottom:4px;}
.tpl-body{color:var(--muted);line-height:1.5;}

.main{flex:1;position:relative;overflow:hidden;}
.canvas-wrap{position:absolute;inset:0;background-image:radial-gradient(circle,#d9d5c9 1px,transparent 1px);background-size:26px 26px;}
#canvas{position:absolute;top:0;left:0;transform-origin:0 0;}
#link-layer{position:absolute;top:0;left:0;width:0;height:0;overflow:visible;pointer-events:none;z-index:1;}

.card{position:absolute;width:180px;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);z-index:5;user-select:none;}
.card.selected{outline:2px solid var(--accent);}
.card.accepted{outline:2px solid var(--green);}
.card .card-img{height:120px;border-radius:12px 12px 0 0;background:linear-gradient(135deg,#e8e4da,#d5cfc0);display:flex;align-items:center;justify-content:center;color:#8a8271;font-size:12px;position:relative;overflow:hidden;}
.card.plant .card-img{background:linear-gradient(135deg,#dce8d5,#b7cfa7);color:#4d6b46;}
.card.scene .card-img{background:linear-gradient(135deg,#e4e0d6,#c9c0aa);color:#6b6353;}
.card.result .card-img{background:linear-gradient(135deg,#dfe6f0,#b9c6dd);color:#4b5c78;}
.card.running .card-img::after{content:'';position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.6) 50%,transparent 70%);animation:scan 1.1s infinite;}
@keyframes scan{from{transform:translateX(-60%);}to{transform:translateX(60%);}}
.card-label{position:absolute;left:10px;top:10px;background:rgba(255,255,255,.8);backdrop-filter:blur(4px);border-radius:999px;padding:3px 8px;font-size:11px;display:flex;align-items:center;gap:5px;font-weight:600;}
.dot{width:8px;height:8px;border-radius:50%;background:#b9b4a8;}
.dot.done{background:var(--green);}
.dot.stale{background:var(--orange);}
.dot.run{background:var(--accent);animation:pulse 1s infinite;}
.dot.fail{background:var(--red);}
@keyframes pulse{50%{box-shadow:0 0 0 5px rgba(124,154,114,.25);}}
.card-body{padding:8px 10px 10px;font-size:11px;color:var(--muted);display:flex;flex-direction:column;gap:5px;}
.card-title{font-weight:600;color:var(--text);font-size:12px;}
.card-meta{display:flex;flex-wrap:wrap;gap:4px;}
.chip{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:2px 6px;font-size:10px;color:var(--muted);}
.card-actions{position:absolute;right:8px;top:8px;display:flex;gap:5px;opacity:0;transition:.15s;}
.card:hover .card-actions{opacity:1;}
.mini-btn{background:var(--panel);border:1px solid var(--line);border-radius:8px;width:24px;height:24px;font-size:12px;display:flex;align-items:center;justify-content:center;color:var(--muted);}
.mini-btn:hover{color:var(--accent-strong);border-color:var(--accent);}
.mini-btn.on{background:var(--accent-soft);color:var(--accent-strong);border-color:var(--accent);}

.cmd-panel{position:absolute;z-index:15;width:300px;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:12px;display:none;}
.cmd-panel.show{display:block;}
.cmd-head{font-size:12px;color:var(--muted);margin-bottom:6px;display:flex;gap:6px;align-items:center;}
.cmd-name{font-weight:600;color:var(--text);}
textarea.prompt{width:100%;height:60px;border:1px solid var(--line);border-radius:10px;padding:8px;font-size:12px;resize:none;outline:none;background:var(--bg);}
textarea.prompt:focus{border-color:var(--accent);}
.cmd-row{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
.cmd-row .chip{padding:5px 8px;cursor:pointer;background:var(--bg);}
.cmd-row .chip.sel{border-color:var(--accent);color:var(--accent-strong);background:var(--accent-soft);}
.cmd-send{margin-left:auto;width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;}
.cmd-send:hover{background:var(--accent-strong);}

.bottom-bar{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);z-index:20;display:flex;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 14px;box-shadow:var(--shadow);}
.bottom-bar button{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--muted);}
.bottom-bar button:hover{background:var(--accent-soft);color:var(--accent-strong);}
.run-selected{background:var(--accent-soft);color:var(--accent-strong);border-radius:999px!important;width:auto!important;padding:0 14px!important;font-size:12px;font-weight:600;display:flex!important;gap:6px;}

.overlay{position:fixed;inset:0;background:rgba(40,35,25,.35);backdrop-filter:blur(3px);z-index:50;display:none;align-items:center;justify-content:center;}
.overlay.show{display:flex;}
.panel{background:var(--panel);border-radius:16px;box-shadow:var(--shadow);width:680px;max-width:92vw;max-height:84vh;overflow:auto;padding:18px;}
.panel h3{margin:0 0 14px;font-size:15px;}
.compare-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;}
.compare-item{border:1px solid var(--line);border-radius:12px;overflow:hidden;}
.compare-item img{width:100%;height:110px;object-fit:cover;display:block;background:#eee;}
.compare-item .ci-body{padding:8px;font-size:11px;}
.compare-item .ci-actions{display:flex;gap:6px;margin-top:6px;}
.trace-box{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:11px;font-family:Consolas,monospace;white-space:pre-wrap;line-height:1.6;color:var(--muted);max-height:260px;overflow:auto;}
.empty-tip{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:var(--muted);font-size:13px;text-align:center;pointer-events:none;}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:8px 16px;border-radius:999px;font-size:12px;z-index:99;opacity:0;pointer-events:none;transition:.2s;}
.toast.show{opacity:1;}
</style>
</head>
<body>

<div class='topbar'>
  <div class='logo'><svg width='17' height='17' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round'><rect x='3' y='3' width='7' height='7' rx='1.5'/><rect x='14' y='3' width='7' height='7' rx='1.5'/><rect x='3' y='14' width='7' height='7' rx='1.5'/><path d='M17.5 14v7M14 17.5h7'/></svg> AI 视觉实验台 · 概念原型</div>
  <div class='project-wrap'><input class='project-name' value='园艺产品 · 白模花境实验'><span class='save-dot'></span></div>
  <div class='topbar-right'>
    <button class='mini-btn' title='新建实验'>＋</button>
    <button class='mini-btn' title='主题' id='btn-theme'>◐</button>
  </div>
</div>

<div class='layout'>
  <aside class='sidebar'>
    <div class='side-tabs'>
      <button class='side-tab active' data-tab='assets'>资产库</button>
      <button class='side-tab' data-tab='templates'>提示词模板</button>
    </div>
    <div class='side-body' id='side-body'></div>
  </aside>

  <div class='main'>
    <div class='canvas-wrap' id='canvas-wrap'>
      <div id='canvas'>
        <svg id='link-layer'></svg>
      </div>
      <div class='empty-tip' id='empty-tip'>从左侧拖入资产，或点击卡片开始实验</div>
    </div>

    <div class='cmd-panel' id='cmd-panel'>
      <div class='cmd-head'><span class='dot' id='p-dot'></span><span class='cmd-name' id='p-name'>未选中</span><span id='p-state'>未运行</span></div>
      <textarea class='prompt' id='p-prompt' placeholder='输入指令，如：把背景换成侘寂风庭院，晨光，陶土质感'></textarea>
      <div class='cmd-row'>
        <button class='chip sel' id='p-model'>nano-banana-pro</button>
        <button class='chip' id='p-ratio'>3:4</button>
        <button class='chip' id='p-res'>2K</button>
        <button class='chip' id='p-count'>4张</button>
        <button class='cmd-send' id='p-send' title='生成'>➤</button>
      </div>
      <div class='cmd-row' style='margin-top:6px;'>
        <button class='mini-btn' id='p-trace'>档案</button>
        <button class='mini-btn' id='p-adopt'>采纳/锁定</button>
        <button class='mini-btn' id='p-compare'>加入对比</button>
        <button class='mini-btn' id='p-repro'>复现</button>
        <button class='mini-btn' id='p-close' style='margin-left:auto;'>×</button>
      </div>
    </div>

    <div class='bottom-bar'>
      <button title='打开'>📂</button>
      <button title='保存 (Ctrl+S)'>💾</button>
      <button title='设置'>⚙</button>
      <button class='run-selected' id='btn-run-selected'>▶ 运行选中 <span id='run-count'></span></button>
      <button class='run-selected' id='btn-compare' style='display:none;'>对比 (<span id='compare-count'>0</span>)</button>
    </div>
  </div>
</div>

<div class='overlay' id='compare-overlay'>
  <div class='panel'>
    <h3>并排对比</h3>
    <div class='compare-grid' id='compare-grid'></div>
    <div style='margin-top:14px;display:flex;gap:8px;justify-content:flex-end;'>
      <button class='mini-btn' id='compare-clear'>清空</button>
      <button class='mini-btn' id='compare-close'>关闭</button>
    </div>
  </div>
</div>

<div class='overlay' id='trace-overlay'>
  <div class='panel' style='width:480px;'>
    <h3>生成档案 · Trace</h3>
    <div class='trace-box' id='trace-content'></div>
    <div style='margin-top:14px;display:flex;justify-content:flex-end;'><button class='mini-btn' id='trace-close'>关闭</button></div>
  </div>
</div>

<div class='toast' id='toast'></div>

<script>
(function(){
  var data = {
    nodes: [
      {id:'n1', type:'scene', title:'白模场景 · 门廊花境', x:90, y:110, status:'done', img:null, accepted:true, meta:['白模','锁定构图'], prompt:'固定场景锚点：门廊 + 台阶 + 陶土盆'},
      {id:'n2', type:'plant', title:'大花绣球', x:360, y:80, status:'done', img:null, accepted:false, meta:['花期6-9月','半阴','蓝/粉/紫'], prompt:'绣球花，球状花序，柔和饱满'},
      {id:'n3', type:'result', title:'变体 A · 晨光', x:620, y:110, status:'done', img:null, accepted:false, meta:['nano-banana-pro','3:4','2K'], prompt:'把背景换成侘寂风庭院，晨光，陶土质感，保留产品造型', trace:{prompt:'把背景换成侘寂风庭院，晨光，陶土质感，保留产品造型',model:'bltcy:nano-banana-pro',aspectRatio:'3:4',resolution:'2k',count:4,refImageHashes:['ab12cd34'],seed:null,createdAt:Date.now()-3600e3,outputType:'img2img'}},
      {id:'n4', type:'result', title:'变体 B · 阴天柔光', x:620, y:290, status:'stale', img:null, accepted:false, meta:['nano-banana-pro','3:4','2K'], prompt:'把背景换成侘寂风庭院，阴天柔光，保留产品造型', trace:{prompt:'把背景换成侘寂风庭院，阴天柔光，保留产品造型',model:'bltcy:nano-banana-pro',aspectRatio:'3:4',resolution:'2k',count:4,refImageHashes:['ab12cd34'],seed:null,createdAt:Date.now()-7200e3,outputType:'img2img'}}
    ],
    edges: [
      {from:'n1', to:'n3'}, {from:'n1', to:'n4'}, {from:'n2', to:'n3'}
    ]
  };
  var selectedId = null;
  var compareSet = [];
  var modelLabel = 'nano-banana-pro';

  var $ = function(id){return document.getElementById(id);};
  var toastTimer = null;
  function toast(msg){
    var t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(function(){t.classList.remove('show');}, 1800);
  }

  function el(tag, cls, text){var d=document.createElement(tag); if(cls)d.className=cls; if(text)d.textContent=text; return d;}

  function renderAssets(){
    var box = $('side-body');
    var assets = [
      {type:'scene', name:'白模场景 · 门廊', tags:'构图锚点'},
      {type:'scene', name:'白模场景 · 庭院', tags:'构图锚点'},
      {type:'plant', name:'大花绣球', tags:'半阴 · 6-9月'},
      {type:'plant', name:'薰衣草', tags:'全日照 · 6-8月'},
      {type:'plant', name:'玉簪', tags:'阴生 · 观叶'},
      {type:'plant', name:'天竺葵', tags:'容器 · 春秋'},
      {type:'render', name:'成图 · 晨光门廊', tags:'已采纳'},
      {type:'render', name:'成图 · 阴天花境', tags:'备选'}
    ];
    var grid = el('div','asset-grid');
    assets.forEach(function(a){
      var item = el('div','asset-item'); item.draggable = true;
      var th = el('div','asset-thumb '+a.type, a.name.slice(0,2));
      item.appendChild(th);
      item.appendChild(el('div','asset-name', a.name));
      item.appendChild(el('div','asset-tags', a.tags));
      item.addEventListener('click', function(){ addNodeFromAsset(a); });
      item.addEventListener('dragstart', function(e){ e.dataTransfer.setData('text/plain', JSON.stringify(a)); });
      grid.appendChild(item);
    });
    box.innerHTML=''; box.appendChild(grid);
  }

  function renderTemplates(){
    var box = $('side-body');
    var tpls = [
      {title:'园艺产品 · 场景融合', body:'{产品} 放在 {场景} 中，{光照}，{材质}，保留产品造型与材质不变'},
      {title:'花境搭配', body:'{花材} 与 {搭配植物} 组合，自然式种植，{季节} 氛围'},
      {title:'门廊白模换花', body:'白模场景不变，把花材替换为 {花材}，{风格} 风格'}
    ];
    box.innerHTML='';
    tpls.forEach(function(t){
      var item = el('div','tpl-item');
      item.appendChild(el('div','tpl-title', t.title));
      item.appendChild(el('div','tpl-body', t.body));
      item.addEventListener('click', function(){ var p=$('p-prompt'); p.value=t.body; toast('模板已填入指令框'); });
      box.appendChild(item);
    });
  }

  $('side-tabs') && document.querySelectorAll('.side-tab').forEach(function(tab){
    tab.addEventListener('click', function(){
      document.querySelectorAll('.side-tab').forEach(function(t){t.classList.remove('active');});
      tab.classList.add('active');
      if(tab.dataset.tab==='assets') renderAssets(); else renderTemplates();
    });
  });

  function renderNodes(){
    var canvas = $('canvas');
    canvas.querySelectorAll('.card').forEach(function(c){c.remove();});
    data.nodes.forEach(function(n){
      var card = el('div','card '+n.type + (n.status==='run'?' running':'') + (n.accepted?' accepted':''));
      card.id = 'card-'+n.id;
      card.style.left = n.x+'px'; card.style.top = n.y+'px';
      card.appendChild(el('div','card-label')).innerHTML = '<span class=\'dot '+n.status+'\'></span>'+n.title;
      var img = el('div','card-img', n.type==='scene' ? '白模场景' : (n.type==='plant' ? '植物资产' : 'AI 生成'));
      card.appendChild(img);
      var body = el('div','card-body');
      body.appendChild(el('div','card-title', n.title));
      var meta = el('div','card-meta');
      (n.meta||[]).forEach(function(m){meta.appendChild(el('span','chip', m));});
      body.appendChild(meta);
      card.appendChild(body);
      var actions = el('div','card-actions');
      var btnCompare = el('button','mini-btn', '⇄'); btnCompare.title='加入对比';
      btnCompare.addEventListener('click', function(e){e.stopPropagation(); toggleCompare(n.id);});
      var btnAccept = el('button','mini-btn'+(n.accepted?' on':''), '✓'); btnAccept.title='采纳/锁定';
      btnAccept.addEventListener('click', function(e){e.stopPropagation(); n.accepted=!n.accepted; n.status='done'; toast(n.accepted?'已采纳并锁定':'已取消采纳'); renderNodes();});
      actions.appendChild(btnCompare); actions.appendChild(btnAccept);
      card.appendChild(actions);
      card.addEventListener('mousedown', function(e){ startDrag(e, n, card); });
      card.addEventListener('click', function(e){ if(!dragMoved){ selectNode(n.id); } });
      canvas.appendChild(card);
    });
    drawLinks();
    syncRunButton();
  }

  function drawLinks(){
    var svg = $('link-layer');
    svg.innerHTML='';
    data.edges.forEach(function(ed){
      var a = data.nodes.find(function(n){return n.id===ed.from;});
      var b = data.nodes.find(function(n){return n.id===ed.to;});
      if(!a||!b) return;
      var x1=a.x+180, y1=a.y+80, x2=b.x, y2=b.y+80;
      var dx=Math.max(40, Math.abs(x2-x1)*0.5);
      var path=document.createElementNS('http://www.w3.org/2000/svg','path');
      path.setAttribute('d','M '+x1+' '+y1+' C '+(x1+dx)+' '+y1+', '+(x2-dx)+' '+y2+', '+x2+' '+y2);
      path.setAttribute('stroke', '#b9c4ae'); path.setAttribute('fill','none'); path.setAttribute('stroke-width','2');
      path.setAttribute('stroke-dasharray','5 5');
      svg.appendChild(path);
    });
  }

  var dragMoved=false, dragInfo=null;
  function startDrag(e, n, card){
    if(e.target.closest('.card-actions') || e.target.closest('.mini-btn')) return;
    dragMoved=false;
    var startX=e.clientX, startY=e.clientY, ox=n.x, oy=n.y;
    function move(ev){
      var dx=ev.clientX-startX, dy=ev.clientY-startY;
      if(Math.abs(dx)+Math.abs(dy)>3) dragMoved=true;
      if(dragMoved){ n.x=ox+dx; n.y=oy+dy; card.style.left=n.x+'px'; card.style.top=n.y+'px'; drawLinks(); }
    }
    function up(){ window.removeEventListener('mousemove',move); window.removeEventListener('mouseup',up); if(dragMoved) toast('卡片已移动'); }
    window.addEventListener('mousemove',move); window.addEventListener('mouseup',up);
  }

  function selectNode(id){
    selectedId = id;
    document.querySelectorAll('.card').forEach(function(c){c.classList.remove('selected');});
    var card = document.getElementById('card-'+id); if(card) card.classList.add('selected');
    var n = data.nodes.find(function(x){return x.id===id;});
    if(n){
      $('p-name').textContent = n.title;
      $('p-dot').className = 'dot '+n.status;
      $('p-state').textContent = n.status==='done'?'已完成':(n.status==='stale'?'待重跑':(n.status==='run'?'运行中':'未运行'));
      $('p-prompt').value = n.prompt||'';
      $('p-prompt').disabled = (n.status==='run');
      positionPanel(n, card);
      $('cmd-panel').classList.add('show');
    }
  }

  function positionPanel(n, card){
    var wrap=$('canvas-wrap').getBoundingClientRect();
    var p=$('cmd-panel');
    var r=card.getBoundingClientRect();
    var x = Math.min(Math.max(r.left-wrap.left, 10), wrap.width-320);
    var y = r.bottom-wrap.top+10;
    if(y+250>wrap.height) y = r.top-wrap.top-260;
    p.style.left=x+'px'; p.style.top=Math.max(0,y)+'px';
  }

  function addNodeFromAsset(a){
    var x=200+Math.random()*500, y=150+Math.random()*350;
    var id='n'+Date.now();
    var meta = a.type==='scene' ? ['白模','构图锚点'] : (a.type==='plant' ? ['植物资产','可拖入场景'] : ['成图']);
    data.nodes.push({id:id, type:a.type, title:a.name, x:x, y:y, status:'done', img:null, accepted:false, meta:meta, prompt:a.name});
    renderNodes(); selectNode(id); toast('已添加：'+a.name);
  }

  function toggleCompare(id){
    var i=compareSet.indexOf(id);
    if(i>=0) compareSet.splice(i,1); else compareSet.push(id);
    $('compare-count').textContent=compareSet.length;
    $('btn-compare').style.display=compareSet.length>0?'inline-flex':'none';
    toast(i>=0?'已移出对比':'已加入对比');
  }

  function showCompare(){
    var grid=$('compare-grid'); grid.innerHTML='';
    compareSet.forEach(function(id){
      var n=data.nodes.find(function(x){return x.id===id;}); if(!n) return;
      var item=el('div','compare-item');
      item.appendChild(el('div','card-img '+n.type, n.title));
      var body=el('div','ci-body');
      body.appendChild(el('div','card-title', n.title));
      body.appendChild(el('div','card-meta'));
      body.lastChild.innerHTML=(n.meta||[]).map(function(m){return '<span class=\'chip\'>'+m+'</span>';}).join('');
      var acts=el('div','ci-actions');
      var ok=el('button','mini-btn', '✓ 采纳');
      ok.addEventListener('click', function(){ n.accepted=true; n.status='done'; renderNodes(); showCompare(); toast('已采纳'); });
      acts.appendChild(ok);
      body.appendChild(acts);
      item.appendChild(body);
      grid.appendChild(item);
    });
    $('compare-overlay').classList.add('show');
  }

  function showTrace(){
    var n=data.nodes.find(function(x){return x.id===selectedId;}); if(!n) return;
    $('trace-content').textContent = n.trace ? JSON.stringify(n.trace, null, 2) : '暂无档案。运行一次生成后，这里会记录 prompt / 模型 / 比例 / 分辨率 / 参考图指纹 / seed。';
    $('trace-overlay').classList.add('show');
  }

  function mockRun(){
    var n=data.nodes.find(function(x){return x.id===selectedId;}); if(!n) return;
    if(n.status==='run') return;
    n.status='run'; n.prompt=$('p-prompt').value||n.prompt;
    renderNodes();
    setTimeout(function(){
      n.status='done'; n.accepted=false;
      var childId='n'+Date.now();
      var child = {id:childId, type:'result', title:'变体 '+String.fromCharCode(67+Math.floor(Math.random()*4))+' · 新', x:n.x+260, y:n.y+180, status:'done', img:null, accepted:false, meta:[modelLabel,'3:4','2K'], prompt:n.prompt, trace:{prompt:n.prompt,model:'bltcy:'+modelLabel,aspectRatio:'3:4',resolution:'2k',count:4,refImageHashes:['hash1','hash2'],seed:null,createdAt:Date.now(),parentId:n.id,outputType:'img2img'}};
      data.nodes.push(child);
      data.edges.push({from:n.id, to:childId});
      renderNodes(); toast('生成完成，已产出新变体并记录档案');
    }, 1200);
  }

  function repro(){
    var n=data.nodes.find(function(x){return x.id===selectedId;}); if(!n) return;
    if(!n.trace){ toast('这张图没有档案，无法复现'); return; }
    $('p-prompt').value = n.trace.prompt;
    modelLabel = n.trace.model.split(':').pop();
    toast('已按档案回填参数，点发送即可复现');
  }

  function syncRunButton(){
    $('run-count').textContent = selectedId ? '(1)' : '';
  }

  $('btn-run-selected').addEventListener('click', function(){
    if(selectedId){ mockRun(); } else toast('请先选中一个节点');
  });
  $('p-send').addEventListener('click', mockRun);
  $('p-close').addEventListener('click', function(){ $('cmd-panel').classList.remove('show'); selectedId=null; document.querySelectorAll('.card').forEach(function(c){c.classList.remove('selected');}); syncRunButton(); });
  $('p-trace').addEventListener('click', showTrace);
  $('p-adopt').addEventListener('click', function(){
    var n=data.nodes.find(function(x){return x.id===selectedId;}); if(!n) return;
    n.accepted=!n.accepted; n.status='done'; renderNodes(); toast(n.accepted?'已采纳并锁定':'已取消采纳');
  });
  $('p-compare').addEventListener('click', function(){ if(selectedId) toggleCompare(selectedId); });
  $('p-repro').addEventListener('click', repro);
  $('btn-compare').addEventListener('click', showCompare);
  $('compare-close').addEventListener('click', function(){ $('compare-overlay').classList.remove('show'); });
  $('compare-clear').addEventListener('click', function(){ compareSet=[]; $('compare-count').textContent='0'; $('btn-compare').style.display='none'; $('compare-grid').innerHTML=''; });
  $('trace-close').addEventListener('click', function(){ $('trace-overlay').classList.remove('show'); });
  $('btn-theme').addEventListener('click', function(){
    var dark=document.body.classList.contains('dark');
    document.body.classList.toggle('dark');
    if(!dark){document.documentElement.style.setProperty('--bg','#25241f');document.documentElement.style.setProperty('--panel','#2f2e28');document.documentElement.style.setProperty('--line','#403e36');document.documentElement.style.setProperty('--text','#ece9e0');document.documentElement.style.setProperty('--muted','#9b9588');}
    else{document.documentElement.removeAttribute('style');}
  });

  $('canvas-wrap').addEventListener('dragover', function(e){e.preventDefault();});
  $('canvas-wrap').addEventListener('drop', function(e){
    e.preventDefault();
    try{ var a=JSON.parse(e.dataTransfer.getData('text/plain')); addNodeFromAsset(a); }catch(err){}
  });

  document.addEventListener('keydown', function(e){
    if(e.key==='Escape'){ $('cmd-panel').classList.remove('show'); $('compare-overlay').classList.remove('show'); $('trace-overlay').classList.remove('show'); }
    if(e.key==='Delete' && selectedId){ data.nodes=data.nodes.filter(function(n){return n.id!==selectedId;}); data.edges=data.edges.filter(function(e){return e.from!==selectedId&&e.to!==selectedId;}); selectedId=null; renderNodes(); }
  });

  renderAssets();
  renderNodes();
})();
</script>
</body>
</html>
