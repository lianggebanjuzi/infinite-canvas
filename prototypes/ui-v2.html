<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Infinite Canvas 2.0 — UI 原型 v4</title>
<style>
/* ═══════════ 设计 Token（温馨园艺风 v4） ═══════════ */
:root {
  --bg-app: #FAF9F6;
  --bg-panel: #FFFFFF;
  --bg-hover: #F4F2EE;
  --bg-active: #ECE9E3;
  --bg-float: #FFFFFF;
  --border: #E9E6E0;
  --border-strong: #D8D3C9;
  --border-soft: #F0EDE8;
  --text-1: #3D3833;
  --text-2: #7A7268;
  --text-3: #9C948A;
  --accent: #7C9A72;
  --accent-dim: rgba(124,154,114,.15);
  --warm: #C08552;               /* 陶土暖棕：次级点缀 */
  --warm-dim: rgba(192,133,82,.14);
  --st-idle: #C9C4BA;
  --st-run: #7C9A72;
  --st-done: #5FA878;
  --st-stale: #D99A4E;
  --st-fail: #D97B6C;
  --canvas-dot: #EDEAE4;
  --link: #D2CEC4;
  /* 圆角三档：小控件 8 / 中容器 12 / 大卡片 16 */
  --r-sm: 8px;
  --r-md: 12px;
  --r-lg: 16px;
  --shadow-node: 0 1px 3px rgba(60,54,46,.05), 0 8px 24px rgba(60,54,46,.07);
  --shadow-bar: 0 4px 14px rgba(60,54,46,.09), 0 12px 36px rgba(60,54,46,.1);
  --font: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
}
[data-theme="dark"] {
  --bg-app: #232220;
  --bg-panel: #2B2A27;
  --bg-hover: #353330;
  --bg-active: #3F3C37;
  --bg-float: #2B2A27;
  --border: #3C3A35;
  --border-strong: #514D45;
  --border-soft: #33312D;
  --text-1: #EFECE6;
  --text-2: #A6A096;
  --text-3: #7C766C;
  --accent: #93AC87;
  --accent-dim: rgba(147,172,135,.18);
  --warm: #D19A6B;
  --warm-dim: rgba(209,154,107,.16);
  --st-idle: #575046;
  --st-run: #93AC87;
  --st-done: #7BBF92;
  --st-stale: #D99A4E;
  --st-fail: #D97B6C;
  --canvas-dot: #3B362F;
  --link: #4A443B;
  --shadow-node: 0 4px 20px rgba(0,0,0,.35), 0 1px 4px rgba(0,0,0,.25);
  --shadow-bar: 0 8px 28px rgba(0,0,0,.45), 0 2px 8px rgba(0,0,0,.3);
}

* { margin:0; padding:0; box-sizing:border-box; user-select:none; }
html, body { height:100%; overflow:hidden; }
body { font-family: var(--font); background: var(--bg-app); color: var(--text-1); font-size:13px; }

/* ═══════════ 顶部栏（极简） ═══════════ */
.topbar {
  height:44px; display:flex; align-items:center; padding:0 16px; gap:12px;
  border-bottom:1px solid var(--border-soft); background: var(--bg-panel);
  position:relative; z-index:20;
}
.logo { display:flex; align-items:center; gap:8px; font-weight:600; font-size:13px; letter-spacing:.02em; }
.logo svg { color: var(--accent); }
.project-wrap { display:flex; align-items:center; gap:7px; }
.project-name {
  background:transparent; border:1px solid transparent; border-radius: var(--r-sm);
  color: var(--text-2); font-family:var(--font); font-size:13px;
  padding:4px 8px; width:190px; outline:none; transition: all .15s;
}
.project-name:hover { border-color: var(--border); color: var(--text-1); }
.project-name:focus { border-color: var(--accent); color: var(--text-1); background: var(--bg-app); }
/* 未保存小圆点（暖棕，保存后消失） */
.save-dot { width:6px; height:6px; border-radius:50%; background: var(--warm); opacity:0; transition: opacity .2s; flex-shrink:0; }
.save-dot.show { opacity:1; }
.topbar-right { margin-left:auto; display:flex; gap:4px; align-items:center; }
.icon-btn {
  width:30px; height:30px; display:flex; align-items:center; justify-content:center;
  border:none; background:transparent; border-radius: var(--r-sm); color: var(--text-2);
  cursor:pointer; transition: all .15s;
}
.icon-btn:hover { background: var(--bg-hover); color: var(--text-1); }
.icon-btn.active { color: var(--accent); background: var(--accent-dim); }

/* ═══════════ 主区域 ═══════════ */
.main { display:flex; height: calc(100% - 44px); position:relative; }

/* 左侧历史图库（悬浮抽屉） */
.left-drawer {
  position:absolute; left:0; top:0; bottom:0; z-index:22; pointer-events:none;
  transform: translateX(-212px); transition: transform .22s ease;
}
.left-drawer.open { transform: translateX(0); }
.left-drawer .drawer-handle {
  position:absolute; left:212px; top:50%; transform: translateY(-50%);
  width:18px; height:64px; display:flex; align-items:center; justify-content:center;
  background: var(--bg-panel); border:1px solid var(--border);
  border-radius: 0 10px 10px 0; color: var(--text-3); cursor:pointer;
  transition: color .15s, background .15s;
  pointer-events:auto;
}
.left-drawer .drawer-handle:hover { color: var(--accent); background: var(--bg-hover); }
.left-drawer .drawer-handle svg { transition: transform .22s ease; }
.left-drawer.open .drawer-handle svg { transform: rotate(180deg); }
.sidebar-left {
  position:absolute; left:12px; top:12px; bottom:12px; width:200px;
  background: var(--bg-panel); border:1px solid var(--border);
  border-radius: var(--r-md); box-shadow: var(--shadow-bar);
  display:flex; flex-direction:column; overflow:hidden;
  pointer-events:auto;
}
.side-head { padding:12px 14px; font-size:12px; font-weight:600; color: var(--text-2); display:flex; align-items:center; justify-content:space-between; }
.side-head span { letter-spacing:.04em; }
.history-grid { padding:0 12px 12px; display:grid; grid-template-columns:1fr 1fr; gap:8px; overflow-y:auto; }
.history-thumb {
  aspect-ratio:3/4; border-radius: var(--r-sm); border:1px solid var(--border-soft);
  cursor:grab; overflow:hidden; transition: border-color .15s;
}
.history-thumb:hover { border-color: var(--accent); }

/* 画布 */
.canvas-wrap { flex:1; position:relative; overflow:hidden; background: var(--bg-app); }
.canvas {
  position:absolute; inset:0; transform-origin: 0 0;
  background-image: radial-gradient(var(--canvas-dot) 1px, transparent 1px);
  background-size: 28px 28px;
}
#link-layer { position:absolute; inset:0; width:100%; height:100%; overflow:visible; pointer-events:none; }
.link-path { fill:none; stroke: var(--link); stroke-width:2; pointer-events:stroke; cursor:pointer; }
.link-path:hover { stroke: var(--border-strong); }
.link-path.flowing {
  stroke: url(#flowGrad); stroke-width:2.5;
  stroke-dasharray: 8 14;
  animation: flow 0.6s linear infinite;
  filter: drop-shadow(0 0 6px rgba(124,154,114,.6));
}
@keyframes flow { to { stroke-dashoffset: -22; } }
/* 连线中点 + 号：hover 连线才出现 */
.link-plus {
  position:absolute; width:18px; height:18px; border-radius:50%;
  background: var(--bg-float); border:1px solid var(--border);
  color: var(--text-2); display:flex; align-items:center; justify-content:center;
  cursor:pointer; z-index:6; transition: all .15s; transform: translate(-50%,-50%) scale(.8);
  opacity:0; pointer-events:none;
}
.link-plus.show { opacity:1; pointer-events:auto; transform: translate(-50%,-50%) scale(1); }
.link-plus:hover { border-color: var(--accent); color: var(--accent); transform: translate(-50%,-50%) scale(1.15); }

/* ═══════════ 图片卡片（图即卡片，高度随图片比例） ═══════════ */
.pcard {
  position:absolute; width:260px; border-radius: var(--r-lg);
  box-shadow: var(--shadow-node); cursor:default; transition: box-shadow .2s;
  border:1.5px solid transparent;
}
.pcard:hover { box-shadow: 0 4px 16px rgba(120,100,80,.1), 0 14px 40px rgba(120,100,80,.12); }
.pcard.selected { border-color: var(--accent); box-shadow: 0 0 0 1.5px var(--accent), var(--shadow-node); }
.pcard-img {
  width:100%; border-radius: var(--r-lg); overflow:hidden;
  position:relative; display:block;
}
.pcard-img .ph { position:absolute; inset:0; transition: filter .5s, opacity .5s; }
.pcard[data-status="run"] .ph { filter: blur(6px) saturate(1.1); opacity:.75; }
.pcard-img .scan {
  position:absolute; inset:0; opacity:0; pointer-events:none;
  background: linear-gradient(180deg, transparent 30%, rgba(124,154,114,.35) 50%, transparent 70%);
  background-size: 100% 250%;
}
.pcard[data-status="run"] .scan { opacity:1; animation: scanMove 1.4s ease-in-out infinite; }
@keyframes scanMove { 0% { background-position: 0 -120%; } 100% { background-position: 0 220%; } }

/* 空步骤卡片：虚线占位 */
.pcard.empty { border:1.5px dashed var(--border-strong); box-shadow:none; background: transparent; }
.pcard.empty:hover { border-color: var(--accent); }
.ph-empty {
  display:flex; flex-direction:column; gap:6px; align-items:center; justify-content:center;
  height:100%; color: var(--text-3); font-size:12px;
}
.ph-empty svg { color: var(--text-3); }

/* 左上标签：暖白底药丸（深浅图上都清晰） */
.pcard-tag {
  position:absolute; top:10px; left:10px; display:flex; align-items:center; gap:6px;
  background: rgba(255,253,250,.88); backdrop-filter: blur(8px);
  color:#4A443C; font-size:11px; padding:4px 9px; border-radius: var(--r-sm);
  box-shadow: 0 1px 4px rgba(60,50,40,.12);
}
.pcard-tag .dot { width:7px; height:7px; border-radius:50%; background: var(--st-idle); transition: background .2s; }
.pcard[data-status="run"]   .pcard-tag .dot { background: var(--st-run); animation: dotPulse 1.2s ease-in-out infinite; }
.pcard[data-status="done"]  .pcard-tag .dot { background: var(--st-done); }
.pcard[data-status="stale"] .pcard-tag .dot { background: var(--st-stale); }
.pcard[data-status="fail"]  .pcard-tag .dot { background: var(--st-fail); }
@keyframes dotPulse { 0%,100% { opacity:1; } 50% { opacity:.35; } }

.pcard-act {
  position:absolute; top:10px; right:10px; width:26px; height:26px; border:none;
  border-radius: var(--r-sm); background: rgba(255,253,250,.88); backdrop-filter: blur(8px);
  color:#4A443C; display:flex; align-items:center; justify-content:center;
  cursor:pointer; opacity:0; transition: all .15s;
  box-shadow: 0 1px 4px rgba(60,50,40,.12);
}
.pcard:hover .pcard-act { opacity:1; }
.pcard-act:hover { background: #FFFDFA; }

/* 端口：视觉小、热区大（::after 扩展到 25px） */
.port {
  position:absolute; width:11px; height:11px; border-radius:50%;
  background: var(--bg-float); border:2px solid var(--border-strong); top:50%;
  transform: translateY(-50%); cursor:crosshair; transition: all .15s; z-index:5;
}
.port::after { content:''; position:absolute; inset:-7px; border-radius:50%; }
.port.in  { left:-6px; }
.port.out { right:-6px; }
.port:hover { border-color: var(--accent); transform: translateY(-50%) scale(1.3); background: var(--accent-dim); }

/* ═══════════ 卡片上方悬浮操作条（仅单选出现） ═══════════ */
.action-bar {
  position:absolute; display:flex; align-items:center; gap:2px; padding:5px;
  background: var(--bg-float); border:1px solid var(--border);
  border-radius: var(--r-md); box-shadow: var(--shadow-bar); z-index:25;
  opacity:0; pointer-events:none; transition: opacity .18s, transform .18s;
  transform: translate(-50%, calc(-100% - 18px));
}
.action-bar.show { opacity:1; pointer-events:auto; transform: translate(-50%, calc(-100% - 10px)); }
.action-bar.pos-below { transform: translate(-50%, 18px); }
.action-bar.pos-below.show { transform: translate(-50%, 10px); }
.act-btn {
  display:flex; align-items:center; gap:6px; padding:6px 11px; border:none;
  background:transparent; border-radius: var(--r-sm); color: var(--text-2);
  font-family:var(--font); font-size:12px; cursor:pointer; transition: all .15s; white-space:nowrap;
}
.act-btn:hover { background: var(--bg-hover); color: var(--text-1); }
.act-btn .new-badge { font-size:10px; background: var(--warm); color:#fff; padding:1px 5px; border-radius:5px; font-weight:600; }
.act-sep { width:1px; height:18px; background: var(--border-strong); margin:0 4px; }

/* ═══════════ 底部指令面板（贴卡片下沿，仅单选出现，智能避让） ═══════════ */
.cmd-panel {
  position:absolute;
  width: min(640px, calc(100% - 48px));
  background: var(--bg-float); border:1px solid var(--border);
  border-radius: var(--r-lg); box-shadow: var(--shadow-bar); z-index:30;
  display:flex; flex-direction:column; overflow:hidden;
  opacity:0; pointer-events:none; transition: opacity .18s, transform .18s;
  transform: translate(-50%, 20px);
}
.cmd-panel.show { opacity:1; pointer-events:auto; transform: translate(-50%, 12px); }
.cmd-panel.pos-above { transform: translate(-50%, calc(-100% - 20px)); }
.cmd-panel.pos-above.show { transform: translate(-50%, calc(-100% - 12px)); }
/* "正在编辑谁" 标识行 */
.cmd-context {
  display:flex; align-items:center; gap:8px; padding:10px 14px 0;
  font-size:12px; color: var(--text-2);
}
.cmd-context .ctx-thumb {
  width:20px; height:20px; border-radius:5px; border:1px solid var(--border);
  background-size:cover; flex-shrink:0;
}
.cmd-context .ctx-name { font-weight:600; color: var(--text-1); }
.cmd-context .ctx-hint { color: var(--text-3); }
.cmd-tabs { display:flex; gap:2px; padding:8px 14px 0; }
.cmd-tab {
  display:flex; align-items:center; gap:5px; border:none; background:transparent;
  color: var(--text-2); font-family:var(--font); font-size:12px; padding:5px 10px;
  border-radius: var(--r-sm); cursor:pointer; transition: all .15s;
}
.cmd-tab:hover { background: var(--bg-hover); color: var(--text-1); }
.cmd-tab.active { color: var(--accent); background: var(--accent-dim); font-weight:600; }
.cmd-refs { display:flex; gap:8px; padding:10px 14px 0; flex-wrap:wrap; }
.cmd-ref {
  width:40px; height:40px; border-radius: var(--r-sm); border:1px solid var(--border-soft);
  overflow:hidden; position:relative; cursor:pointer; transition: border-color .15s;
}
.cmd-ref:hover { border-color: var(--accent); }
.cmd-ref-add {
  width:40px; height:40px; border-radius: var(--r-sm); border:1px dashed var(--border-strong);
  background:transparent; color: var(--text-3); cursor:pointer;
  display:flex; align-items:center; justify-content:center; transition: all .15s;
}
.cmd-ref-add:hover { border-color: var(--accent); color: var(--accent); }
.cmd-input {
  border:none; outline:none; resize:none; background:transparent;
  font-family:var(--font); font-size:13px; color: var(--text-1);
  padding:10px 14px; min-height:52px; line-height:1.6; user-select:text;
}
.cmd-input::placeholder { color: var(--text-3); }
.cmd-controls {
  display:flex; align-items:center; gap:6px; padding:8px 10px 10px;
}
.cmd-chip {
  display:flex; align-items:center; gap:5px; border:1px solid transparent;
  background: var(--bg-hover); color: var(--text-2); font-family:var(--font);
  font-size:11.5px; padding:5px 10px; border-radius: var(--r-sm); cursor:pointer; transition: all .15s;
  white-space:nowrap;
}
.cmd-chip:hover { background: var(--bg-active); color: var(--text-1); }
.cmd-chip svg { color: var(--text-3); }
.cmd-chip .chev { font-size:9px; opacity:.6; }
.cmd-send {
  margin-left:auto; width:34px; height:34px; border:none; border-radius:50%;
  background: var(--accent); color:#fff; display:flex; align-items:center; justify-content:center;
  cursor:pointer; transition: all .15s; flex-shrink:0;
}
.cmd-send:hover { background: var(--warm); transform: scale(1.05); }

/* 选中框 */
.selection-box {
  position:absolute; border:1px solid var(--accent); background: var(--accent-dim);
  display:none; z-index:8; border-radius:2px; pointer-events:none;
}

/* ═══════════ 底部胶囊条（打开/保存/主题/设置） ═══════════ */
.bottom-bar {
  position:absolute; bottom:16px; left:50%; transform:translateX(-50%);
  display:flex; align-items:center; gap:2px; padding:6px 8px;
  background: var(--bg-float); border:1px solid var(--border);
  border-radius:999px; box-shadow: var(--shadow-bar); z-index:35;
}
.bottom-bar .icon-btn { width:30px; height:30px; border-radius:50%; }
.bar-sep { width:1px; height:16px; background: var(--border); margin:0 3px; }

/* 提示 toast */
.toast-hint {
  position:absolute; bottom:74px; left:50%; transform: translateX(-50%) translateY(8px);
  background: var(--bg-float); border:1px solid var(--border-strong); border-radius:10px;
  padding:8px 14px; font-size:12px; color: var(--text-2); box-shadow: var(--shadow-bar);
  opacity:0; transition: all .25s; z-index:40; pointer-events:none; display:flex; gap:8px; align-items:center;
}
.toast-hint.show { opacity:1; transform: translateX(-50%) translateY(0); }
.toast-hint svg { color: var(--st-done); flex-shrink:0; }

::-webkit-scrollbar { width:8px; }
::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius:4px; }
::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>

<!-- 顶部：极简 -->
<header class="topbar">
  <div class="logo">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><path d="M17.5 14v7M14 17.5h7"/></svg>
    Infinite Canvas
  </div>
  <div class="project-wrap">
    <input class="project-name" id="project-name" value="园艺花盆-北欧风系列" spellcheck="false">
    <span class="save-dot" id="save-dot" title="有未保存的修改"></span>
  </div>
</header>

<div class="main">
  <!-- 左侧：历史图库（悬浮抽屉 + 把手） -->
  <div class="left-drawer" id="left-drawer">
    <button class="drawer-handle" id="drawer-handle" title="历史图库">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
    </button>
    <aside class="sidebar-left" id="sidebar-left">
      <div class="side-head"><span>历史图库</span></div>
      <div class="history-grid" id="history-grid"></div>
    </aside>
  </div>

  <!-- 画布 -->
  <div class="canvas-wrap" id="canvas-wrap">
    <!-- 顶部悬浮操作条（仅单选出现） -->
    <div class="action-bar" id="action-bar">
      <button class="act-btn">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.8a2 2 0 0 0 1.3 1.3L21 12l-5.8 1.9a2 2 0 0 0-1.3 1.3L12 21l-1.9-5.8a2 2 0 0 0-1.3-1.3L3 12l5.8-1.9a2 2 0 0 0 1.3-1.3L12 3Z"/></svg>
        风格调节 <span class="new-badge">NEW</span>
      </button>
      <button class="act-btn">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
        扩图
      </button>
      <button class="act-btn">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M3 12s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6Z"/></svg>
        多角度
      </button>
      <button class="act-btn">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.6.5 1 1.3 1 2.5h6c0-1.2.4-2 1-2.5A6 6 0 0 0 12 3Z"/></svg>
        打光
      </button>
      <button class="act-btn">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8Z"/></svg>
        高清放大
      </button>
      <div class="act-sep"></div>
      <button class="act-btn" title="下载">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
      </button>
    </div>

    <div class="canvas" id="canvas">
      <svg id="link-layer">
        <defs>
          <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="0%">

    </button>

<div class="toast-hint" id="toast"></div>

<script>
/* ═══════════ 画布视图 ═══════════ */
const wrap = document.getElementById('canvas-wrap');
const canvas = document.getElementById('canvas');
const linkLayer = document.getElementById('link-layer');
const view = { x: 60, y: 40, scale: 1 };
function applyView() { canvas.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.scale})`; syncBars(); }

let panning = false, panStart = null;
wrap.addEventListener('mousedown', e => {
  if (e.target.closest('.pcard') || e.target.closest('.cmd-panel') || e.target.closest('.action-bar') || e.target.closest('.link-plus')) return;
  if (e.shiftKey) return;
  panning = true;
  panStart = { mx: e.clientX, my: e.clientY, vx: view.x, vy: view.y };
  wrap.style.cursor = 'grabbing';
});
window.addEventListener('mousemove', e => {
  if (panning && panStart) {
    view.x = panStart.vx + (e.clientX - panStart.mx);
    view.y = panStart.vy + (e.clientY - panStart.my);
    applyView();
  }
});
window.addEventListener('mouseup', () => { panning = false; wrap.style.cursor = ''; });
wrap.addEventListener('wheel', e => {
  e.preventDefault();
  const delta = e.deltaY > 0 ? 0.92 : 1.08;
  const ns = Math.min(2, Math.max(0.3, view.scale * delta));
  const rect = wrap.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  view.x = mx - (mx - view.x) * (ns / view.scale);
  view.y = my - (my - view.y) * (ns / view.scale);
  view.scale = ns;
  applyView();
}, { passive: false });

/* ═══════════ 占位"照片"（CSS 渐变模拟园艺场景图） ═══════════ */
const PHOTO_PRODUCT = `
  background:
    radial-gradient(circle at 70% 20%, rgba(255,255,250,.92) 0%, transparent 48%),
    radial-gradient(circle at 32% 76%, rgba(166,190,148,.38) 0%, transparent 55%),
    linear-gradient(160deg, #EEF1E5 0%, #DDE6CF 52%, #C6D4B4 100%);`;
const PHOTO_SCENE = `
  background:
    radial-gradient(circle at 25% 18%, rgba(255,255,252,.95) 0%, transparent 50%),
    radial-gradient(circle at 76% 72%, rgba(192,178,152,.3) 0%, transparent 55%),
    linear-gradient(150deg, #F2EEE5 0%, #E5DFCE 55%, #D1C8B2 100%);`;
const PHOTO_CLOSEUP = `
  background:
    radial-gradient(circle at 62% 28%, rgba(255,255,246,.9) 0%, transparent 44%),
    radial-gradient(circle at 32% 72%, rgba(150,176,134,.36) 0%, transparent 55%),
    linear-gradient(140deg, #DFE7D3 0%, #C2D1B1 55%, #A6BA95 100%);`;

/* ═══════════ 卡片数据：宽度固定，高度 = 宽 ÷ ratio（随图片比例） ═══════════ */
const CARD_W = 260;
const cards = [
  { id: 'c1', x: 0,    y: 60, tag: '产品图',     status: 'done', photo: PHOTO_PRODUCT,  ratio: 3/4 },
  { id: 'c2', x: 340,  y: 60, tag: '北欧风场景', status: 'idle', photo: PHOTO_SCENE,    ratio: 3/4 },
  { id: 'c3', x: 680,  y: 60, tag: '细节特写',   status: 'idle', photo: PHOTO_CLOSEUP,  ratio: 1/1 },
  { id: 'c4', x: 1020, y: 60, tag: '下一步',     status: 'idle', photo: null,           ratio: 3/4, empty: true },
];
const links = [ { from: 'c1', to: 'c2' }, { from: 'c2', to: 'c3' }, { from: 'c3', to: 'c4' } ];
const cardH = c => CARD_W / c.ratio;

function renderCard(c) {
  const el = document.createElement('div');
  el.className = 'pcard' + (c.empty ? ' empty' : '');
  el.id = c.id;
  el.dataset.status = c.status;
  el.style.left = c.x + 'px';
  el.style.top = c.y + 'px';
  const inner = c.empty
    ? `<div class="ph-empty">
         <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
         点「+」或选中上游后生成
       </div>`
    : `<div class="ph" style="${c.photo}"></div><div class="scan"></div>`;
  el.innerHTML = `
    <div class="pcard-img" style="height:${cardH(c)}px">${inner}</div>
    <div class="pcard-tag"><span class="dot"></span>${c.tag}</div>
    ${c.empty ? '' : `<button class="pcard-act" title="查看大图">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
    </button>`}
    <div class="port in"></div>
    <div class="port out"></div>
  `;
  canvas.appendChild(el);
  c.el = el;
  bindDrag(el, c);
  bindSelect(el, c);
}

/* 拖动卡片：选中多张时整组一起动 */
function bindDrag(el, c) {
  el.addEventListener('mousedown', e => {
    if (e.target.closest('.port') || e.target.closest('.pcard-act')) return;
    e.stopPropagation();
    const multi = el.classList.contains('selected') && selected.size > 1;
    const start = { mx: e.clientX, my: e.clientY, nx: c.x, ny: c.y };
    const group = multi
      ? [...selected].map(id => {
          const cc = cards.find(x => x.id === id);
          return { el: cc.el, x: cc.x, y: cc.y };
        })
      : null;
    function mv(ev) {
      const dx = (ev.clientX - start.mx) / view.scale;
      const dy = (ev.clientY - start.my) / view.scale;
      if (multi) {
        group.forEach(g => {
          const cc = cards.find(x => x.el === g.el);
          cc.x = g.x + dx;
          cc.y = g.y + dy;
          g.el.style.left = cc.x + 'px';
          g.el.style.top = cc.y + 'px';
        });
      } else {
        c.x = start.nx + dx;
        c.y = start.ny + dy;
        el.style.left = c.x + 'px';
        el.style.top = c.y + 'px';
      }
      drawLinks();
      syncBars();
    }
    function up() {
      window.removeEventListener('mousemove', mv);
      window.removeEventListener('mouseup', up);
    }
    window.addEventListener('mousemove', mv);
    window.addEventListener('mouseup', up);
  });
}

/* 选中：仅单选时弹出操作条 + 指令面板；多选全部隐藏 */
const selected = new Set();
function bindSelect(el, c) {
  el.addEventListener('mousedown', e => {
    e.stopPropagation();
    // 点击已选中的卡片（无 Shift）保留整组选中，才能整组拖动；点空白处取消
    if (!e.shiftKey && !el.classList.contains('selected')) {
      selected.clear();
      document.querySelectorAll('.pcard.selected').forEach(x => x.classList.remove('selected'));
    }
    selected.add(c.id);
    el.classList.add('selected');
    syncBars();
  });
}
canvas.addEventListener('mousedown', e => {
  if (e.target === canvas || e.target === linkLayer) {
    selected.clear();
    document.querySelectorAll('.pcard.selected').forEach(x => x.classList.remove('selected'));
    syncBars();
  }
});

function syncBars() {
  const ab = document.getElementById('action-bar');
  const cp = document.getElementById('cmd-panel');
  // 多选或无选中：都不显示
  if (selected.size !== 1) {
    ab.classList.remove('show', 'pos-below');
    cp.classList.remove('show', 'pos-above');
    return;
  }
  const id = [...selected][0];
  const c = cards.find(x => x.id === id);
  if (!c) return;

  // 更新"正在编辑谁"标识
  document.getElementById('ctx-name').textContent = c.tag;
  document.getElementById('ctx-thumb').style.cssText = c.photo || 'background: var(--bg-hover);';
  document.getElementById('ctx-hint').textContent =
    c.status === 'stale' ? '· 上游已改，待重跑' :
    c.status === 'done'  ? '· 已完成' :
    c.status === 'run'   ? '· 生成中' : '';

  const wr = wrap.getBoundingClientRect();
  const cx0 = view.x + (c.x + CARD_W / 2) * view.scale;
  const topY = view.y + c.y * view.scale;
  const botY = view.y + (c.y + cardH(c)) * view.scale;

  // 智能避让：下方放不下 → 面板翻到卡片上方、操作条挪到下方
  const cpH = cp.offsetHeight || 240;
  const roomBelow = wr.height - botY;
  const flip = roomBelow < cpH + 24 && topY > cpH + 70;
  cp.classList.toggle('pos-above', flip);
  ab.classList.toggle('pos-below', flip);

  // 横向钳制在视口内
  const cpW = cp.offsetWidth || 640;
  const cpCx = Math.min(Math.max(cx0, cpW / 2 + 12), wr.width - cpW / 2 - 12);
  const abCx = Math.min(Math.max(cx0, 200), wr.width - 200);

  cp.style.left = cpCx + 'px';
  cp.style.top = (flip ? topY : botY) + 'px';
  ab.style.left = abCx + 'px';
  ab.style.top = (flip ? botY : topY) + 'px';

  ab.classList.add('show');
  cp.classList.add('show');
}

/* ═══════════ 连线 ═══════════ */
function drawLinks() {
  linkLayer.querySelectorAll('path').forEach(p => p.remove());
  canvas.querySelectorAll('.link-plus').forEach(p => p.remove());
  links.forEach(l => {
    const a = cards.find(n => n.id === l.from);
    const b = cards.find(n => n.id === l.to);
    const x1 = a.x + CARD_W, y1 = a.y + cardH(a) / 2;
    const x2 = b.x, y2 = b.y + cardH(b) / 2;
    const dx = Math.max(50, Math.abs(x2 - x1) * 0.5);
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', `M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`);
    path.setAttribute('class', 'link-path' + (l.flowing ? ' flowing' : ''));
    linkLayer.appendChild(path);
    // 连线中点 + 号：hover 连线才出现
    const plus = document.createElement('div');
    plus.className = 'link-plus';
    plus.style.left = (x1 + x2) / 2 + 'px';
    plus.style.top = (y1 + y2) / 2 + 'px';
    plus.innerHTML = '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';
    plus.title = '在中间插入步骤';
    plus.addEventListener('click', () => toast('插入步骤（原型演示）'));
    canvas.appendChild(plus);
    path.addEventListener('mouseenter', () => plus.classList.add('show'));
    path.addEventListener('mouseleave', () => setTimeout(() => { if (!plus.matches(':hover')) plus.classList.remove('show'); }, 120));
    plus.addEventListener('mouseleave', () => plus.classList.remove('show'));
  });
}

/* ═══════════ 运行演示 ═══════════ */
const runChain = ['c1', 'c2', 'c3'];
let running = false;

function toast(msg, ok = true) {
  const t = document.getElementById('toast');
  t.innerHTML = (ok
    ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>'
    : '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#D97B6C" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg>') + msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2600);
}

function setLinkFlow(from, to, on) {
  const l = links.find(x => x.from === from && x.to === to);
  if (l) { l.flowing = on; drawLinks(); }
}

function runCard(id) {
  return new Promise(resolve => {
    const c = cards.find(x => x.id === id);
    if (!c || c.status === 'done' || c.empty) { resolve(); return; }
    c.status = 'run';
    c.el.dataset.status = 'run';
    const nextIdx = runChain.indexOf(id) + 1;
    if (nextIdx < runChain.length) setLinkFlow(id, runChain[nextIdx], true);
    setTimeout(() => {
      c.status = 'done';
      c.el.dataset.status = 'done';
      if (nextIdx < runChain.length) setLinkFlow(id, runChain[nextIdx], false);
      syncBars();
      resolve();
    }, 1500);
  });
}

async function runAll(ids) {
  if (running) return;
  running = true;
  for (const id of ids) await runCard(id);
  running = false;
  toast('生成完成');
}

/* 发送 = 生成 */
document.getElementById('cmd-send').addEventListener('click', () => {
  const input = document.getElementById('cmd-input').value.trim();
  runAll(runChain);
  if (input) { document.getElementById('cmd-input').value = ''; markDirty(); }
});

/* 改指令 → 下游标 stale */
document.getElementById('cmd-input').addEventListener('input', () => {
  cards.forEach(c => {
    if (c.id !== 'c1' && c.status !== 'run' && !c.empty) {
      c.status = 'stale';
      c.el.dataset.status = 'stale';
    }
  });
  syncBars();
});

/* 标签切换 */
document.querySelectorAll('.cmd-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.cmd-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
  });
});

/* ═══════════ 框选 ═══════════ */
const selBox = document.getElementById('selection-box');
let selecting = false, selStart = null;
wrap.addEventListener('mousedown', e => {
  if (!e.shiftKey || e.target.closest('.pcard')) return;
  selecting = true;
  const rect = wrap.getBoundingClientRect();
  selStart = { x: e.clientX - rect.left, y: e.clientY - rect.top };
  selBox.style.display = 'block';
});
window.addEventListener('mousemove', e => {
  if (!selecting) return;
  const rect = wrap.getBoundingClientRect();
  const cx = e.clientX - rect.left, cy = e.clientY - rect.top;
  selBox.style.left = Math.min(cx, selStart.x) + 'px';
  selBox.style.top = Math.min(cy, selStart.y) + 'px';
  selBox.style.width = Math.abs(cx - selStart.x) + 'px';
  selBox.style.height = Math.abs(cy - selStart.y) + 'px';
});
window.addEventListener('mouseup', () => {
  if (!selecting) return;
  selecting = false;
  const sb = selBox.getBoundingClientRect();
  selBox.style.display = 'none';
  selected.clear();
  document.querySelectorAll('.pcard.selected').forEach(x => x.classList.remove('selected'));
  cards.forEach(c => {
    const r = c.el.getBoundingClientRect();
    if (r.left < sb.right && r.right > sb.left && r.top < sb.bottom && r.bottom > sb.top) {
      selected.add(c.id);
      c.el.classList.add('selected');
    }
  });
  syncBars();
});

/* ═══════════ 未保存标记 ═══════════ */
const saveDot = document.getElementById('save-dot');
function markDirty() { saveDot.classList.add('show'); }
document.getElementById('project-name').addEventListener('input', markDirty);

/* ═══════════ 左侧悬浮抽屉 / 主题 / 杂项 ═══════════ */
const leftDrawer = document.getElementById('left-drawer');
function setDrawer(open) {
  leftDrawer.classList.toggle('open', open);
}
document.getElementById('drawer-handle').addEventListener('click', () => setDrawer(!leftDrawer.classList.contains('open')));
setDrawer(false);
document.getElementById('btn-theme').addEventListener('click', () => {
  const html = document.documentElement;
  html.dataset.theme = html.dataset.theme === 'dark' ? 'light' : 'dark';
});
document.getElementById('btn-save').addEventListener('click', () => { saveDot.classList.remove('show'); toast('项目已保存'); });
document.getElementById('btn-open').addEventListener('click', () => toast('打开项目（原型演示）'));
document.getElementById('btn-settings').addEventListener('click', () => toast('设置面板（原型演示）'));

/* 历史图库 + 面板参考图 */
function thumb(photoCss) {
  const d = document.createElement('div');
  d.className = 'history-thumb';
  d.style.cssText = photoCss;
  return d;
}
const hg = document.getElementById('history-grid');
[PHOTO_PRODUCT, PHOTO_SCENE, PHOTO_CLOSEUP, PHOTO_PRODUCT, PHOTO_SCENE, PHOTO_CLOSEUP].forEach(p => hg.appendChild(thumb(p)));
document.getElementById('cmd-ref-main').style.cssText = PHOTO_PRODUCT;

/* 初始化 */
cards.forEach(renderCard);
applyView();
requestAnimationFrame(drawLinks);
window.addEventListener('resize', () => { drawLinks(); syncBars(); });
</script>
</body>
</html>
